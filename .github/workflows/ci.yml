name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Restore test fixtures
        run: dotnet restore tests/RoslynCodeLens.Tests/Fixtures/TestSolution/TestSolution.slnx

      - name: Build
        run: dotnet build --no-restore -c Release

      # xunit v3 is MTP-native. On the .NET 10 SDK the VSTest target is no longer
      # supported for MTP apps, so tests run by launching the compiled test host directly
      # (see .roo/rules-code/01-test.md). Coverage comes from the MTP CodeCoverage extension.
      - name: Test
        run: |
          dotnet tests/RoslynCodeLens.Tests/bin/Release/net10.0/RoslynCodeLens.Tests.dll \
            --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml \
            --results-directory ./TestResults

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: "TestResults/coverage.cobertura.xml"
          disable_search: true   # only the file above, not every *.xml the search finds
          fail_ci_if_error: false
